<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page1">

<!-- Animated Background -->
<div class="background-animation">
    <div class="floating-particle"></div>
    <div class="floating-particle"></div>
    <div class="floating-particle"></div>
    <div class="floating-particle"></div>
</div>

<div class="center-box">
    <div class="emoji-animation">✨</div>
    <h1>Someone Special Awaits</h1>
    <p>Enter the name of the one who owns your heart 💕</p>
    <p class="signature-text">~ With endless love, from Ali ✨💌</p>

    <div class="input-wrapper">
        <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off">
        <span class="input-focus-border"></span>
    </div>
    
    <button id="continueBtn" class="btn-primary">Continue 💌</button>
    <p class="error-message" id="errorMsg"></p>
</div>

<script src="script.js"></script>
</body>
</html>
